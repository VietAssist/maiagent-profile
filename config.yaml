model:
  default: "@preset/vietassist-pro"
  provider: custom:vietassist-pro
  base_url: https://openrouter.ai/api/v1
  api_mode: chat_completions

custom_providers:
  - name: VietAssist Pro
    base_url: https://openrouter.ai/api/v1
    api_key: "${OPENROUTER_API_KEY}"
    discover_models: false
    model: "@preset/vietassist-pro"

platform_toolsets:
  cli:
    - hermes-cli
  telegram:
    - hermes-telegram

browser:
  backend: "off"
  cloud_provider: local
  engine: auto
  allow_private_urls: false
  use_real_profile: false

plugins:
  enabled:
    - clawhost-connect-chatgpt

agent:
  service_tier: fast
